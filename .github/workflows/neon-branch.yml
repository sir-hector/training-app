name: Neon branch per PR

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: neon-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  create:
    name: Create branch + migrate + integration + e2e tests
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
          # The project has several roles (Data API adds authenticator/anonymous/
          # authenticated); migrations need the owner role.
          username: neondb_owner
          database: neondb

      - name: Run migrations against the PR branch
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}

      - name: Integration tests against the PR branch
        run: npm run test:integration
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}

      # --- End-to-end: production build served on the runner, backed by the
      # PR's Neon branch. Google sign-in is bypassed by seeding a DB session
      # (see e2e/test-user.ts), so the OAuth values below are placeholders.
      - name: Generate throwaway auth secret
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}

      - name: E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          AUTH_URL: http://localhost:3000
          AUTH_TRUST_HOST: "true"
          AUTH_GOOGLE_ID: e2e-placeholder
          AUTH_GOOGLE_SECRET: e2e-placeholder

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  delete:
    name: Delete branch
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
